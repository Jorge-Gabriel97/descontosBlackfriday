# Só para os testes (soma-se ao application.properties principal).
# Desliga o envio real de e-mail: sem isso, as variáveis SPRING_MAIL_* do Windows
# fariam os testes mandarem e-mails de verdade pela conta da Brevo.
# (Variáveis de ambiente valem mais que este arquivo, mas não reativam uma autoconfiguração excluída.)
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
