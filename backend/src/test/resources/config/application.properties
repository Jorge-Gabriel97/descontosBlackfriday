# Sem isso, as variáveis SPRING_MAIL_* do Windows fariam os testes enviarem e-mails de verdade.
# O Spring Session também fica de fora: o MockMvc passa a sessão pelo objeto, não pelo cookie que ele lê.
# PostgresTest liga o Spring Session de novo para testar a sessão gravada no banco.
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,\
  org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
