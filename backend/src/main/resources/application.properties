spring.application.name=descontosBlackfriday
server.port=8080
# Devolve a mensagem dos erros (ex.: "Este produto já é monitorado") para o frontend exibir
spring.web.error.include-message=always

# Banco em arquivo para os produtos monitorados sobreviverem a reinícios
spring.datasource.url=jdbc:h2:file:./data/descontos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Console do H2 desligado: com login, ele seria uma porta aberta para o banco
spring.h2.console.enabled=false

# Login por sessão: o cookie expira após 7 dias sem uso
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Intervalo entre as verificações automáticas de preço (ISO-8601: PT1H = 1 hora)
app.monitor.intervalo=PT1H
app.monitor.atraso-inicial=PT1M

# Acesso ao KaBuM!: o app se identifica e espera entre uma requisição e outra
# para não sobrecarregar o site (veja "Uso do site do KaBuM!" no README.md).
app.kabum.user-agent=DescontosBlackfriday/0.1 (monitor de precos pessoal)
app.kabum.intervalo-entre-requisicoes=PT5S

# E-mail: configure via variáveis de ambiente (veja README.md).
# Sem SPRING_MAIL_HOST definido, as notificações são apenas registradas no log.
app.mail.remetente=${SPRING_MAIL_USERNAME:descontos-blackfriday@localhost}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
