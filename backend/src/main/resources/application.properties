spring.application.name=descontosBlackfriday
server.port=8080
spring.web.error.include-message=always

spring.datasource.url=jdbc:h2:file:./data/descontos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.monitor.intervalo=PT1H
app.monitor.atraso-inicial=PT1M

app.kabum.user-agent=DescontosBlackfriday/0.1 (monitor de precos pessoal)
app.kabum.intervalo-entre-requisicoes=PT5S

# Credenciais SMTP vêm de variáveis de ambiente (README.md); sem SPRING_MAIL_HOST, os avisos só vão para o log
app.mail.remetente=${SPRING_MAIL_USERNAME:descontos-blackfriday@localhost}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
