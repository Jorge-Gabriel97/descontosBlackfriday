# Ativado com SPRING_PROFILES_ACTIVE=prod. As variáveis PG* vêm do PostgreSQL do Railway
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.flyway.baseline-on-migrate=false

# Sem valor padrão: um link de e-mail apontando para localhost em produção não serviria para ninguém
app.url-publica=${APP_URL_PUBLICA}

# O HTTPS termina no proxy do Railway; os cabeçalhos X-Forwarded-* dizem ao Tomcat o IP real e o https
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
